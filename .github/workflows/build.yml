name: Build DebugMenu dylib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile DebugMenu dylib
        run: |
          set -e
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            -miphoneos-version-min=14.0 \
            -install_name @rpath/DebugMenu.dylib \
            -o DebugMenu.dylib \
            DebugMenu.m

      - name: Vérifier le binaire
        run: |
          test -f DebugMenu.dylib
          ls -lh DebugMenu.dylib

      - name: Publier le dylib
        uses: actions/upload-artifact@v4
        with:
          name: DebugMenu
          path: DebugMenu.dylib
